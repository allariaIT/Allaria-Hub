apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: user-projects
data:
  nginx.conf: |
    server {
        listen 80;

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # PROJECT ROUTES — managed by hub-back, do not edit manually
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-projects-router
  namespace: user-projects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-projects-router
  template:
    metadata:
      labels:
        app: user-projects-router
    spec:
      imagePullSecrets:
        - name: swr-pull-secret
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: router-config
---
apiVersion: v1
kind: Service
metadata:
  name: user-projects-router
  namespace: user-projects
spec:
  type: NodePort
  selector:
    app: user-projects-router
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30099
